# Schema version 1: accepted by ig config check; gateway runtime not implemented.
# External tenant-scoped portal contract; hosted service/runtime is not implemented.
# Replace interface/service details and register these IDs with the portal service.
schema_version = 1

[gateway]
name = "guest-network"
platform_mode = "managed" # IronGate owns only its declared host resources.
forwarding = "userspace"
unmatched_subscriber_traffic = "drop"

[interfaces]
upstream = "enp1s0"

[[networks]]
name = "guest"
interface = "enp2s0"
tagging = "untagged"
session_limit = 200
mtu = 1500
ipv6 = "blocked"

[networks.ipv4]
subnet = "192.168.50.0/24"
gateway = "192.168.50.1"

[networks.dhcp]
mode = "local"
range_start = "192.168.50.20"
range_end = "192.168.50.250"
lease_seconds = 600

[networks.dns]
upstream_servers = ["192.0.2.53"] # Documentation address; replace before use.

[networks.portal]
hosting = "external" # Separate portal service, on a LAN or in the cloud.
mode = "external_uam"
url = "https://portal.example.test/tenants/tenant-a/login"
tenant_id = "tenant-a"
site_id = "site-one"
gateway_id = "ig-lab-01"
secret_file = "/etc/irongate/secrets/portal"

[networks.authentication]
provider = "radius"
radius_pool = "central"

[networks.accounting]
sink = "radius"
radius_pool = "central"
interim_seconds = 60 # Show any server override in effective policy.

[[radius.pools]]
name = "central"
timeout_seconds = 3
retries = 2

[[radius.pools.servers]]
name = "primary"
address = "192.0.2.10" # Documentation address; replace before use.
transport = "udp"
auth_port = 1812
accounting_port = 1813
secret_file = "/etc/irongate/secrets/radius-primary"
priority = 1
status_probe = "disabled" # Enable only for a supported, configured peer.

[[radius.pools.servers]]
name = "secondary"
address = "192.0.2.11"
transport = "udp"
auth_port = 1812
accounting_port = 1813
secret_file = "/etc/irongate/secrets/radius-secondary"
priority = 2
status_probe = "disabled"

[networks.policy]
radius_unavailable = "deny_new_sessions"
existing_sessions_on_radius_outage = "retain_granted_policy"
session_timeout_seconds = 3600
idle_timeout_seconds = 300

[capacity]
# Illustrative limits, not a measured RAM or throughput guarantee.
max_networks = 1
max_sessions = 200
packet_buffers = 512
packet_buffer_bytes = 2048
pending_radius_requests = 128
shaping_queue_packets = 256 # Descriptors reference buffers from the shared pool.
