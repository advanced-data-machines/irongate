# Schema version 1: accepted by ig config check; gateway runtime not implemented.
# A standalone consent portal does not verify individual user identity.
schema_version = 1

[gateway]
name = "standalone-guest-network"
platform_mode = "managed"
forwarding = "userspace"
unmatched_subscriber_traffic = "drop"

[interfaces]
upstream = "enp1s0"

[[networks]]
name = "guest"
interface = "enp2s0"
tagging = "untagged"
session_limit = 200
mtu = 1500
ipv6 = "blocked"

[networks.ipv4]
subnet = "192.168.50.0/24"
gateway = "192.168.50.1"

[networks.dhcp]
mode = "local"
range_start = "192.168.50.20"
range_end = "192.168.50.250"
lease_seconds = 600

[networks.dns]
upstream_servers = ["192.0.2.53"] # Documentation address; replace before use.

[networks.portal]
hosting = "local" # Page is served on the gateway device.
mode = "builtin_consent"
listen = "192.168.50.1:3990"
terms_file = "/etc/irongate/terms.html"

[networks.authentication]
provider = "consent"

[networks.accounting]
sink = "local"
journal_path = "/var/lib/irongate/accounting"
journal_max_bytes = 67108864 # Proposed bounded disk budget, not a RAM pool.
on_journal_full = "deny_new_sessions"
# Existing-session and crash durability semantics must be specified before use.

[networks.policy]
session_timeout_seconds = 3600
idle_timeout_seconds = 300

[capacity]
# Illustrative values, not a measured scale profile.
max_networks = 1
max_sessions = 200
packet_buffers = 512
packet_buffer_bytes = 2048
pending_radius_requests = 0 # The disabled provider reserves no request slots.
shaping_queue_packets = 256
