[package]
name = "irongated"
description = "IronGate network access gateway daemon scaffold"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
irongate-core = { path = "../irongate-core" }
irongate-proto = { path = "../irongate-proto" }
serde_json.workspace = true
httparse = "1.10.1"
md-5 = "=0.10.6"
hmac = "=0.12.1"
subtle = "2.6.1"
zeroize = "1.9.1"
form_urlencoded = "=1.2.2"
toml.workspace = true
http.workspace = true
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"] }

rustix = { version = "1.1.5", default-features = false, features = ["std", "event", "rand", "fs"] }
