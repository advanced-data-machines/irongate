[workspace]
members = [
    "crates/irongate-core",
    "crates/irongate-proto",
    "crates/irongate-config",
    "crates/irongate-cli",
    "crates/irongated",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-2.0-or-later"
publish = false

[workspace.dependencies]
serde_json = "1.0.149"
toml = { version = "1.1.8", default-features = false, features = ["parse", "std"] }
ipnet = "2.12.2"
http = "1.5.0"
irongate-config = { path = "crates/irongate-config" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
